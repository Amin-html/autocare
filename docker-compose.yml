  name: autocare

  services:
    db:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: autocare
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Создайте файл .env (см. .env.example)}
        POSTGRES_DB: autocare
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U autocare -d autocare"]
        interval: 5s
        timeout: 5s
        retries: 12

    backend:
      build: ./backend
      environment:
        DATABASE_URL: postgresql://autocare:${POSTGRES_PASSWORD}@db:5432/autocare
        JWT_SECRET: ${JWT_SECRET:?Создайте файл .env (см. .env.example)}
        SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      depends_on:
        db:
          condition: service_healthy
      ports:
        - "8000:8000"
      volumes:
        - uploads:/app/uploads
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 20s

    frontend:
      build:
        context: ./frontend
        args:
          NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      depends_on:
        backend:
          condition: service_healthy
      ports:
        - "3000:3000"

  volumes:
    pgdata:
    uploads:
